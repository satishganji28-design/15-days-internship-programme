<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <label for="name">Enter your name:</label>
        <input type="text"placeholder="your name"  name="name" id="name" required>
        <br>
        <label for="email">Your email:</label>
        <input type="email" placeholder="your email"  name="email" id="email" required>
        <br>
        <label for="password">Your password:</label>
        <input type="password" placeholder="your password"  name="password" id="password" required>
        <br>
        <label for="subject">Subject:</label>
        <select name="subject" id="subject">
            <option value="" selected disabled>select an option</option>
            <option value="hire">i want to hire you</option>
            <option value="collaborate">we will collaborate</option>
        </select>
        <br>  
        <label for="message">Your message:</label>  
        <textarea name="message" id="message" cols="30" rows="10" placeholder="write about your project" required></textarea>
        <br>
        <label for="gender">Gender:</label>
        <select name="gender" id="gender">
            <option value="" selected disabled>select an option</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
        </select>
        <br>
        <label for="hobbies">Hobbies :</label>
        <input type="checkbox" name="hobbies" id="hobbies" value="reading">
        <label for="hobbies">Reading</label>
        <input type="checkbox" name="hobbies" id="hobbies" value="swimming">
        <label for="hobbies">Swimming</label>
        <input type="checkbox" name="hobbies" id="hobbies" value="cooking">
        <label for="hobbies">Cooking</label>
        <br>

        <button type="submit">Submit</button>

    </form>

</body>
</html>
