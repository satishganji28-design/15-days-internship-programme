<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button{
           background-color:blue;
           color:aliceblue;
           padding: 15px 30px;
           border: none;
           cursor: pointer;
           transition:all 10s ease;
           
        }
        button:hover{
            background-color: aquamarine;
            transform: scale(1.2);
            box-shadow: 0px 15px 40px  red;
        }
        @keyframes fadeIn{
            from{
                opacity: 0;
            }
            to{
                opacity: 1;
            }
            
        }
        h1{
            animation: fadeIn 6s;
        }
        .ball{
            width: 80px;
            height: 80px;
            background-color: aqua;
            border-radius: 50%;
            animation: bounce 3s infinite;
        }
        @keyframes bounce{
            0%{
                transform: translateY(0);
            }
            50%{
                transform: translateY(-100px);
            }
            100%{
                transform: translateY(0);
            }
            

        }
        .box{
            width: 120px;
            height: 120px;
            background-color: aquamarine;
            animation: spin 4s infinite;
        }
        @keyframes spin{
            from{
                transform: rotate(0deg);
            }
            to{
                transform: rotate(360deg);
            }
        }
        button{
            padding: 15px;
            background-color: black;
            color: aqua;
            border: none;
            animation: pulse 2s infinite;


        }
        @keyframes pulse{
            0%{
                transform: scale(1);
            }
            50%{
                transform: scale(1.3);
            }
            100%{
                transform: scale(1);
            }
        }
        h2{
            animation: fadeInUp 4s ease;
        }
        @keyframes fadeInUp{
            from{
                opacity: 0;
                transform: translateY(50px);
            }
            to{
                opacity:1;
                transform: translateY(0);
            }
        }

    </style>
</head>
<body>
    <button>Hove me</button>
    <h1>Hello Students</h1>
    <div class="ball"></div>
    <div class="box"></div>
    <br>
    <br>
    <button>Subscribe</button>
    <br><br><br><br>
    <h2>Welcome to CSS</h2>
</body>
</html>

<!--transition : property duration timing-function;
timing-function:
ease / ease-in-out-> start slowly
moves fast
ends slowly
linear-> same speed form start to end
ease-in -> starts slow, ends fast
ease-out-> starts fast, ends slow -->
